[versions]
agp = "9.3.2"
# Kotlin 2.4 requires a separate compiler-warning migration.
#noinspection NewerVersionAvailable
kotlin = "2.2.21"
ksp = "2.3.11"
# Kotlin 2.2 compatibility; newer analyzer versions require Kotlin 2.3 or 2.4.
#noinspection NewerVersionAvailable
composeStabilityAnalyzer = "0.6.4"
composeBom = "2026.08.00"
core = "1.19.0"
activity = "1.13.0"
lifecycle = "2.11.0"
room = "2.8.4"
datastore = "1.2.1"
biometric = "1.1.0"
okhttp = "5.5.0"
serialization = "1.11.0"
coroutines = "1.11.0"
zxing = "3.5.4"
bip39 = "1.0.9"
# Sol4k 0.8.x is compiled with Kotlin 2.4 metadata.
#noinspection NewerVersionAvailable
sol4k = "0.6.1"
solanaMobile = "0.3.1"
codeScanner = "16.1.0"
junit = "4.13.2"
androidxJunit = "1.3.0"
espresso = "3.7.0"
ktlintGradle = "14.2.0"
detekt = "1.23.8"
# Detekt 1.x compatibility; 0.6.x requires Detekt 2 alpha.
#noinspection NewerVersionAvailable
composeRulesDetekt = "0.4.23"
composeRulesKtlint = "0.6.4"
desugarJdkLibs = "2.1.5"
owaspDependencyCheck = "13.0.0"
androidSecurityLints = "1.0.4"
roborazzi = "1.73.0"
robolectric = "4.16.1"
sonarqube = "7.4.0.8496"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
kotlin-bip39 = { module = "cash.z.ecc.android:kotlin-bip39", version.ref = "bip39" }
sol4k = { module = "org.sol4k:sol4k", version.ref = "sol4k" }
solana-mobile = { module = "com.solanamobile:web3-solana", version.ref = "solanaMobile" }
play-services-code-scanner = { module = "com.google.android.gms:play-services-code-scanner", version.ref = "codeScanner" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
compose-rules-detekt = { module = "io.nlopez.compose.rules:detekt", version.ref = "composeRulesDetekt" }
compose-rules-ktlint = { module = "io.nlopez.compose.rules:ktlint", version.ref = "composeRulesKtlint" }
android-security-lints = { module = "com.android.security.lint:lint", version.ref = "androidSecurityLints" }
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugarJdkLibs" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
owasp-dependency-check = { id = "org.owasp.dependencycheck", version.ref = "owaspDependencyCheck" }
stability-analyzer = { id = "com.github.skydoves.compose.stability.analyzer", version.ref = "composeStabilityAnalyzer" }
sonarqube = { id = "org.sonarqube", version.ref = "sonarqube" }
