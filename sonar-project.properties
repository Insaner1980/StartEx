sonar.projectKey=Insaner1980_StartEx
sonar.organization=insaner1980
sonar.host.url=https://sonarcloud.io

sonar.exclusions=**/build/**,**/generated/**
sonar.cpd.exclusions=**/build/**,**/generated/**
sonar.coverage.exclusions=**/ui/**,**/service/**,**/network/**,**/data/local/**,**/data/settings/**,**/MainActivity.kt,**/StartExApplication.kt,**/SessionApiKeySource.kt,**/device/DeviceHealth.kt,**/security/AndroidKeystoreSecretCipher.kt,**/wallet/SolanaPrivateKeyDeriver.kt,**/data/StartExRepository.kt

# Compose screen functions are declarative UI trees; parameter count and nested DSL lambdas do not
# describe the maintainability of the state and business logic that remains fully analyzed.
sonar.issue.ignore.multicriteria=composeParameters,composeScreensComplexity,composeRootComplexity
sonar.issue.ignore.multicriteria.composeParameters.ruleKey=kotlin:S107
sonar.issue.ignore.multicriteria.composeParameters.resourceKey=**/ui/**/*.kt
sonar.issue.ignore.multicriteria.composeScreensComplexity.ruleKey=kotlin:S3776
sonar.issue.ignore.multicriteria.composeScreensComplexity.resourceKey=**/ui/screens/**/*.kt
sonar.issue.ignore.multicriteria.composeRootComplexity.ruleKey=kotlin:S3776
sonar.issue.ignore.multicriteria.composeRootComplexity.resourceKey=**/ui/StartExApp.kt

sonar.secrets.excluded.file.suffixes=.png
sonar.scm.use.blame.algorithm=GIT_NATIVE_BLAME
